[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fork-project"
version = "0.1.0"
description = "Fork: tested decision simulations and explainable flip points"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
  "numpy>=2.2,<3", "httpx>=0.28,<1", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "reportlab>=4.3,<5", "pypdf>=5,<7"]
platform = ["contree-sdk==0.3.6"]

[tool.setuptools.packages.find]
include = ["apps*", "forklib*", "packs*", "mocks*", "scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests", "forklib", "apps/api"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "node_modules", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
